name: Build
on:
  pull_request:
    branches:
      - main
  push:
    paths: [
      "src/**",
      "scripts/**",
      "eleventy.js",
      "package.json",
      "yarn.lock",
      ".github/workflows/**"
    ] # Trigger only when relevant files change
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Build job — lints CSS and validates that the site compiles.
  # Production deploys are handled by the Vercel GitHub App (see docs/DEPLOYMENT.md).
  build:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Set up Node.js ☕
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Install dependencies 📦
        run: yarn install --frozen-lockfile
      # Cache the embedding model so it doesn't re-download from HuggingFace
      # on every build. Keyed on the embeddings script (which holds MODEL_NAME),
      # so the cache busts automatically when the model changes.
      - name: Cache embedding model 🧠
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-model-${{ hashFiles('scripts/generate-embeddings.mjs') }}
          restore-keys: |
            transformers-model-
      - name: Lint CSS 🧹
        run: yarn lint:css
        continue-on-error: true
      - name: Build site 🔧
        run: yarn build
      # Reports broken internal links/anchors in the build output. Non-blocking
      # for now (like lint:css) until the existing catalog is confirmed clean;
      # drop continue-on-error to make it a hard gate.
      - name: Validate internal links 🔗
        run: yarn lint:links
        continue-on-error: true

name: Build
on:
  pull_request:
    branches:
      - main
  push:
    paths: [
      "src/**",
      "scripts/**",
      "config/eleventy/**",
      "eleventy.js",
      "package.json",
      "yarn.lock",
      ".github/workflows/**"
    ] # Trigger only when relevant files change
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Build job — lints CSS and validates that the site compiles.
  # Production deploys are handled by the Vercel GitHub App (see docs/DEPLOYMENT.md).
  build:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Set up Node.js ☕
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Install dependencies 📦
        run: yarn install --frozen-lockfile
      - name: Test Git hooks 🪝
        run: yarn test
      # Cache the embedding model so it doesn't re-download from HuggingFace
      # on every build. Keyed on the embeddings script (which holds MODEL_NAME),
      # so the cache busts automatically when the model changes.
      - name: Cache embedding model 🧠
        uses: actions/cache@v6
        with:
          path: .cache/transformers
          key: transformers-model-${{ hashFiles('scripts/generate-embeddings.mjs') }}
          restore-keys: |
            transformers-model-
      - name: Lint CSS 🧹
        run: yarn lint:css
        continue-on-error: true
      - name: Build site 🔧
        run: yarn build
      # Hard gate. The catalog is clean (12,686 internal links, 0 broken), so
      # the "non-blocking until confirmed clean" caveat this step used to carry
      # has been met.
      #
      # It is a gate rather than a report because of what it catches. A build
      # once shipped 48 pages whose every listing thumbnail pointed at
      # `/.11ty/image/?src=…`, the dev-server endpoint, which 404s in
      # production -- `failOnError: false` turns a transient image-transform
      # failure into a broken URL rather than a failed build. The link checker
      # DOES detect those (verified), but `continue-on-error` meant CI went
      # green anyway and two first-time readers found them instead.
      - name: Validate internal links 🔗
        run: yarn lint:links

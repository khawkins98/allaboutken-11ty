<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8px; }
      .panel-header { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
      
      .text-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .text-subtitle { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .text-section-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; text-transform: uppercase; letter-spacing: 0.5px; }
      .text-body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #334155; }
      .text-body-bold { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .text-caption { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #64748b; }
      .text-mono { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #0f172a; }
      .text-mono-bold { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .text-mono-accent { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; fill: #004f91; }

      .badge { rx: 4px; }
      .badge-blue { fill: #e0f2fe; stroke: #bae6fd; }
      .badge-text-blue { font-family: 'IBM Plex Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #0369a1; }
      
      .badge-green { fill: #dcfce7; stroke: #bbf7d0; }
      .badge-text-green { font-family: 'IBM Plex Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #15803d; }

      .badge-amber { fill: #fef3c7; stroke: #fde68a; }
      .badge-text-amber { font-family: 'IBM Plex Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #b45309; }

      .row-divider { stroke: #f1f5f9; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1120" height="700" class="bg" />

  <!-- Outer Border -->
  <rect x="16" y="16" width="1088" height="668" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" class="text-title">Five Brands, One Token Engine: Invariance vs. Adaptation</text>
    <text x="0" y="22" class="text-subtitle">How 540 Figma variables propagate across UNDRR, DELTA Resilience, IRP, MCR2030, and PreventionWeb</text>
    
    <!-- Summary Tag -->
    <g transform="translate(730, -18)">
      <rect x="0" y="0" width="318" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="21" class="text-caption">Architecture:</text>
      <text x="90" y="21" class="text-mono-accent" fill="#15803d">87.2% Invariant</text>
      <text x="180" y="21" class="text-caption">|</text>
      <text x="195" y="21" class="text-mono-accent" fill="#b91c1c">12.8% Variant</text>
    </g>
  </g>

  <!-- TOP SECTION: THE FIVE BRANDS COMPARISON TABLE -->
  <g transform="translate(40, 92)">
    <rect x="0" y="0" width="1040" height="300" class="panel" />
    <path d="M 0 8 Q 0 0 8 0 L 1032 0 Q 1040 0 1040 8 L 1040 40 L 0 40 Z" class="panel-header" />
    
    <!-- Table Header Columns -->
    <text x="20" y="25" class="text-section-title">Brand Mode</text>
    <text x="210" y="25" class="text-section-title">Primary Brand Color</text>
    <text x="400" y="25" class="text-section-title">Control Geometry (Radius)</text>
    <text x="630" y="25" class="text-section-title">Thematic Adaptation</text>
    <text x="880" y="25" class="text-section-title">Release Status</text>

    <!-- Row 1: UNDRR -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="1040" height="52" fill="#ffffff" />
      <circle cx="30" cy="26" r="10" fill="#004f91" />
      <text x="52" y="30" class="text-body-bold">UNDRR</text>
      <text x="52" y="44" class="text-caption">Core system identity</text>
      
      <rect x="210" y="16" width="22" height="20" rx="3" fill="#004f91" />
      <text x="240" y="30" class="text-mono">#004F91</text>
      <text x="310" y="30" class="text-caption">(Blue 600)</text>

      <text x="400" y="30" class="text-mono">Button: 7px · Checkbox: 7px</text>

      <text x="630" y="30" class="text-body">Baseline typography, neutral tints</text>

      <rect x="880" y="16" width="125" height="22" rx="4" class="badge-blue" />
      <text x="892" y="31" class="badge-text-blue">Release Candidate</text>
      <line x1="0" y1="52" x2="1040" y2="52" class="row-divider" />
    </g>

    <!-- Row 2: DELTA Resilience -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="1040" height="52" fill="#f8fafc" />
      <circle cx="30" cy="26" r="10" fill="#004f91" />
      <text x="52" y="30" class="text-body-bold">DELTA Resilience</text>
      <text x="52" y="44" class="text-caption">Shared UNDRR palette</text>

      <rect x="210" y="16" width="22" height="20" rx="3" fill="#004f91" />
      <text x="240" y="30" class="text-mono">#004F91</text>
      <text x="310" y="30" class="text-caption">(Blue 600)</text>

      <text x="400" y="30" class="text-mono">Button: 7px · Checkbox: 7px</text>

      <text x="630" y="30" class="text-body">Hero-overlay padding = spacing/400 (50px)</text>

      <rect x="880" y="16" width="125" height="22" rx="4" class="badge-amber" />
      <text x="896" y="31" class="badge-text-amber">Review Pending</text>
      <line x1="0" y1="52" x2="1040" y2="52" class="row-divider" />
    </g>

    <!-- Row 3: IRP -->
    <g transform="translate(0, 144)">
      <rect x="0" y="0" width="1040" height="52" fill="#ffffff" />
      <circle cx="30" cy="26" r="10" fill="#0f78bf" />
      <text x="52" y="30" class="text-body-bold">IRP</text>
      <text x="52" y="44" class="text-caption">Intl Recovery Platform</text>

      <rect x="210" y="16" width="22" height="20" rx="3" fill="#0f78bf" />
      <text x="240" y="30" class="text-mono">#0F78BF</text>
      <text x="310" y="30" class="text-caption">(Vivid Sky Blue)</text>

      <text x="400" y="30" class="text-mono">Button: 7px · Checkbox: 7px</text>

      <text x="630" y="30" class="text-body">Tinted soft surface #ECF4FA</text>

      <rect x="880" y="16" width="125" height="22" rx="4" class="badge-amber" />
      <text x="896" y="31" class="badge-text-amber">Review Pending</text>
      <line x1="0" y1="52" x2="1040" y2="52" class="row-divider" />
    </g>

    <!-- Row 4: MCR2030 -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="1040" height="52" fill="#f8fafc" />
      <circle cx="30" cy="26" r="10" fill="#591a61" />
      <text x="52" y="30" class="text-body-bold">MCR2030</text>
      <text x="52" y="44" class="text-caption">Making Cities Resilient</text>

      <rect x="210" y="16" width="22" height="20" rx="3" fill="#591a61" />
      <text x="240" y="30" class="text-mono">#591A61</text>
      <text x="310" y="30" class="text-caption">(Deep Plum)</text>

      <text x="400" y="30" class="text-mono-bold" fill="#7e22ce">Button: 32px (Pill) · Box: 12px</text>

      <text x="630" y="30" class="text-body">Distinct curved radius + Plum soft hover</text>

      <rect x="880" y="16" width="125" height="22" rx="4" class="badge-amber" />
      <text x="896" y="31" class="badge-text-amber">Review Pending</text>
      <line x1="0" y1="52" x2="1040" y2="52" class="row-divider" />
    </g>

    <!-- Row 5: PreventionWeb -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="1040" height="52" fill="#ffffff" />
      <circle cx="30" cy="26" r="10" fill="#0a6969" />
      <text x="52" y="30" class="text-body-bold">PreventionWeb</text>
      <text x="52" y="44" class="text-caption">Knowledge base platform</text>

      <rect x="210" y="16" width="22" height="20" rx="3" fill="#0a6969" />
      <text x="240" y="30" class="text-mono">#0A6969</text>
      <text x="310" y="30" class="text-caption">(Forest Teal)</text>

      <text x="400" y="30" class="text-mono">Button: 7px · Checkbox: 7px</text>

      <text x="630" y="30" class="text-body">Teal soft surface #EBF3F3 + option tints</text>

      <rect x="880" y="16" width="125" height="22" rx="4" class="badge-amber" />
      <text x="896" y="31" class="badge-text-amber">Review Pending</text>
    </g>
  </g>

  <!-- BOTTOM SECTION: THREE DETAILED CASE STUDIES -->
  <g transform="translate(40, 410)">
    
    <!-- Card 1: 471 Shared Tokens Engine -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="330" height="258" class="panel" />
      <path d="M 0 8 Q 0 0 8 0 L 322 0 Q 330 0 330 8 L 330 38 L 0 38 Z" class="panel-header" />
      <text x="14" y="24" class="text-section-title">The Shared Core (87.2%)</text>
      
      <g transform="translate(14, 50)">
        <text x="0" y="16" class="text-body-bold">What Never Changes Between Brands:</text>
        
        <text x="0" y="40" class="text-mono-bold">• Global Neutrals (100% shared):</text>
        <text x="12" y="56" class="text-caption">neutral-0 (#FFF) to neutral-900 (#1A1A1A)</text>
        
        <text x="0" y="80" class="text-mono-bold">• Spacing Scale (94.4% shared):</text>
        <text x="12" y="96" class="text-caption">spacing/0 to spacing/1000 identical in all 5</text>
        
        <text x="0" y="120" class="text-mono-bold">• Typography Stack (100% shared):</text>
        <text x="12" y="136" class="text-caption">Roboto for Text/Heading; Condensed for UI</text>

        <rect x="0" y="152" width="302" height="42" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
        <text x="10" y="170" class="text-body-bold" fill="#15803d">Single Library Advantage:</text>
        <text x="10" y="184" class="text-caption" fill="#166534">Prevents 5 separate drawing files to maintain.</text>
      </g>
    </g>

    <!-- Card 2: ComboBox & Table Real-World Limits -->
    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="330" height="258" class="panel" />
      <path d="M 0 8 Q 0 0 8 0 L 322 0 Q 330 0 330 8 L 330 38 L 0 38 Z" class="panel-header" />
      <text x="14" y="24" class="text-section-title">Real Application Checks</text>
      
      <g transform="translate(14, 50)">
        <text x="0" y="16" class="text-body-bold">The ComboBox 0.55 → 55 Bug:</text>
        <text x="0" y="34" class="text-caption">Disabled opacity test passed in simulated unit</text>
        <text x="0" y="48" class="text-caption">tests, but in Figma rendered invisible control.</text>
        
        <rect x="0" y="60" width="302" height="44" rx="4" fill="#fef2f2" stroke="#fecaca" />
        <text x="10" y="77" class="text-mono-bold" fill="#b91c1c">disabled-opacity: 55</text>
        <text x="10" y="93" class="text-caption" fill="#991b1b">Corrected fraction-to-percentage conversion.</text>

        <text x="0" y="126" class="text-body-bold">Table Cell Layout Collision:</text>
        <text x="0" y="144" class="text-caption">Long cell labels collided with fixed dividers.</text>
        <text x="0" y="158" class="text-caption">Showed that editable text cannot solve dynamic</text>
        <text x="0" y="172" class="text-caption">browser table-layout without explicit limits.</text>
        
        <text x="0" y="196" class="text-mono" font-size="10.5px" fill="#475569">Limits documented in Reference Catalogue.</text>
      </g>
    </g>

    <!-- Card 3: Spacing Propagation & Override Preservation -->
    <g transform="translate(710, 0)">
      <rect x="0" y="0" width="330" height="258" class="panel" />
      <path d="M 0 8 Q 0 0 8 0 L 322 0 Q 330 0 330 8 L 330 38 L 0 38 Z" class="panel-header" />
      <text x="14" y="24" class="text-section-title">Token Propagation Test</text>
      
      <g transform="translate(14, 50)">
        <text x="0" y="16" class="text-body-bold">Tested Spacing Value Update:</text>
        <text x="0" y="34" class="text-caption">Changed UNDRR spacing/300 from 30px to 32px</text>
        <text x="0" y="48" class="text-caption">in the library, then published to consuming file.</text>
        
        <rect x="0" y="60" width="302" height="44" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
        <text x="10" y="77" class="text-mono-bold" fill="#1d4ed8">spacing/300: 30px → 32px → 30px</text>
        <text x="10" y="93" class="text-caption" fill="#1e40af">Verified layout shifted and restored cleanly.</text>

        <text x="0" y="126" class="text-body-bold">What Survived the Update (56 Instances):</text>
        <text x="0" y="146" class="text-mono">✔ Designer-edited custom labels</text>
        <text x="0" y="164" class="text-mono">✔ Optional content visibility toggles</text>
        <text x="0" y="182" class="text-mono">✔ Selected component states &amp; modes</text>
        <text x="0" y="200" class="text-mono">✔ Personal notes outside generated boards</text>
      </g>
    </g>

  </g>

</svg>
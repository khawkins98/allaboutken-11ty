      .flow-ribbon { fill-opacity: 0.18; stroke-width: 1; }
      .flow-ribbon:hover { fill-opacity: 0.35; }
    </style>
    
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="120%">

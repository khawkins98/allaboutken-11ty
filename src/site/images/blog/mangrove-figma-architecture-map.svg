<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #22252A; }
      .subtitle { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #636A75; }
      .col-header { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #636A75; text-transform: uppercase; letter-spacing: 1.2px; }
      .node-title { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #22252A; }

  <!-- Bottom Story Narrative Tray -->
  <g transform="translate(44, 535)">
    <rect width="1092" height="175" rx="10" fill="#F4EFE6" stroke="#E5DEC9" stroke-width="1.2" />
    
    <text x="24" y="28" class="col-header" fill="#22252A">Three Empirical Findings Unlocked by Structured Content</text>
    
    <!-- Insight 1: Opacity Bug -->
    <g transform="translate(24, 46)">
      <rect width="330" height="105" rx="6" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1" />
      <circle cx="18" cy="20" r="6" fill="#E05A47" />
      <text x="32" y="24" class="node-title">The 0.55 vs 55% Opacity Blind Spot</text>
      <text x="18" y="48" class="node-sub">Automated headless tests accepted CSS 0.55,</text>
      <text x="18" y="66" class="node-sub">but Figma variables required integer 55%.</text>
      <text x="18" y="88" class="badge-text" fill="#E05A47">Canvas inspection caught invisible control</text>
    </g>

    <!-- Insight 2: Invariance Ratio -->
    <g transform="translate(380, 46)">
      <rect width="330" height="105" rx="6" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1" />
      <circle cx="18" cy="20" r="6" fill="#D4A373" />
      <text x="32" y="24" class="node-title">87.2% Invariance = 5 Brands at Scale</text>
      <text x="18" y="48" class="node-sub">471 of 540 tokens never change across brands.</text>
      <text x="18" y="66" class="node-sub">Only 69 tokens adapt (radii, tints, primary).</text>
      <text x="18" y="88" class="badge-text" fill="#D4A373">Shared container eliminates multi-kit drift</text>
    </g>

    <!-- Insight 3: Propagation & Maintenance -->
    <g transform="translate(736, 46)">
      <rect width="330" height="105" rx="6" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1" />
      <circle cx="18" cy="20" r="6" fill="#004F91" />
      <text x="32" y="24" class="node-title">Spacing Token Update (30px → 32px)</text>
      <text x="18" y="48" class="node-sub">Propagated through 56 pilot instances while</text>
      <text x="18" y="66" class="node-sub">preserving local copy, states, and designer notes.</text>
      <text x="18" y="88" class="badge-text" fill="#004F91">Rebuilding structure vs lightweight sync</text>
    </g>
  </g>

</svg>
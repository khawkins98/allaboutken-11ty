  <!-- Background -->
  <rect width="1180" height="760" fill="#FAF7F0" />
  <rect x="12" y="12" width="1156" height="736" rx="12" fill="none" stroke="#E5DEC9" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(44, 48)">
    <text x="0" y="0" class="title">The Architecture of Invariance: How Structured Content Flows into Figma</text>
    <text x="0" y="22" class="subtitle">Tracing 540 Storybook design tokens across 5 brand modes into 396 living symbols and 56 linked pilot instances.</text>
    
    <!-- Legend / Stats pill -->
    <g transform="translate(780, -18)">
      <rect x="0" y="0" width="310" height="36" rx="18" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1" filter="url(#shadow)" />
      <circle cx="20" cy="18" r="5" fill="#D4A373" />
      <text x="32" y="22" class="badge-text" fill="#22252A">87.2% Shared Core (471)</text>
      <circle cx="190" cy="18" r="5" fill="#591A61" />
      <text x="202" y="22" class="badge-text" fill="#22252A">12.8% Adapts (69)</text>
    </g>
  </g>

